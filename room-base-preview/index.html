<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Room Base Model Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #e9e4dc; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    .toolbar { position: absolute; z-index: 2; inset: 14px 14px auto; display: flex; flex-wrap: wrap; gap: 7px; }
    button { border: 1px solid #9b9287; border-radius: 5px; background: rgba(255,255,255,.9); color: #393634; padding: 7px 10px; cursor: pointer; font-size: 12px; }
    button:hover { background: #fff; border-color: #5f5a55; }
    .readout { margin-left: auto; padding: 7px 10px; color: #393634; background: rgba(255,255,255,.82); border-radius: 5px; font-size: 12px; }
    .caption { position: absolute; z-index: 2; left: 16px; bottom: 16px; padding: 8px 10px; color: #4b4640; background: rgba(255,255,255,.76); border-radius: 5px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar">
      <button data-view="front">正面</button>
      <button data-view="side">右侧</button>
      <button data-view="back">背面</button>
      <button data-view="top">顶视</button>
      <button data-view="three">三分之四</button>
      <span class="readout" id="readout">独立底座 · 28:15.3 比例 · 程序化模型</span>
    </div>
    <div class="caption">roomBase · lowerPlinth / upperPlatform / stonePaving / woodenFloor</div>
  </div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createRoomBaseModel } from './createRoomBaseModel.js?preview=20260831e';

    const app = document.querySelector('#app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#e9e4dc');
    const camera = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    app.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xfff7eb, 0x56524d, 2.1));
    const key = new THREE.DirectionalLight(0xffe1bd, 3.0);
    key.position.set(-5, 10, 7); key.castShadow = true; key.shadow.mapSize.set(1536, 1536); scene.add(key);
    const fill = new THREE.DirectionalLight(0xdce7f2, 0.9);
    fill.position.set(7, 5, -6); scene.add(fill);

    const ground = new THREE.Mesh(
      new THREE.PlaneGeometry(40, 40),
      new THREE.MeshStandardMaterial({ color: 0xe2dcd3, roughness: 1 })
    );
    ground.rotation.x = -Math.PI / 2; ground.position.y = -1.58; ground.receiveShadow = true; scene.add(ground);

    // Reference proportions: 28 cm wide x 15.3 cm deep x 10.8 cm overall.
    const model = createRoomBaseModel({
      width: 8.4,
      depth: 4.59,
      lowerHeight: 0.48,
      upperHeight: 0.42,
      radius: 0.24,
      frontOpeningWidth: 2.55,
      frontOpeningDepth: 0.72,
      planters: 2,
      streetLamp: true,
      agencyPlaque: true,
      seed: 31
    });
    model.name = 'roomBase';
    model.userData.referenceRatio = { width: 28, depth: 15.3, overallHeight: 10.8 };
    scene.add(model);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.minDistance = 3.5; controls.maxDistance = 16;
    controls.target.set(0, 0.05, 0);
    const views = {
      front: { p: [0, 3.6, 13.2] },
      side: { p: [13.2, 3.6, 0] },
      back: { p: [0, 3.6, -13.2] },
      top: { p: [0, 12.5, 0.01] },
      three: { p: [8.4, 6.7, 8.8] }
    };
    function setView(name) {
      const view = views[name]; if (!view) return;
      camera.position.set(...view.p); controls.target.set(0, 0, 0); controls.update();
      document.querySelector('#readout').textContent = `独立底座 · ${name} view · 28:15.3 比例`;
    }
    document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => setView(button.dataset.view)));
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });

    model.updateMatrixWorld(true);
    const bounds = new THREE.Box3().setFromObject(model);
    document.body.dataset.roomBaseBounds = JSON.stringify({ min: bounds.min.toArray(), max: bounds.max.toArray(), size: bounds.getSize(new THREE.Vector3()).toArray() });
    window.roomBasePreview = { model, camera, controls, views, bounds: JSON.parse(document.body.dataset.roomBaseBounds) };
    setView(new URLSearchParams(location.search).get('view') || 'three');

    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
  </script>
</body>
</html>
