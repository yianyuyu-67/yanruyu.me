<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Clue Board Preview</title>
  <style>
    :root { color-scheme:light; font-family:Inter,"Microsoft YaHei",system-ui,sans-serif; }
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#f7f5ef; }
    #app { position:relative; width:100%; height:100%; }
    canvas { display:block; width:100%; height:100%; }
    .toolbar { position:absolute; z-index:3; top:14px; left:14px; right:14px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
    button,.readout { pointer-events:auto; border:1px solid #c9c3b7; border-radius:7px; padding:8px 11px; background:rgba(255,255,255,.92); color:#3f443f; box-shadow:0 2px 8px rgba(55,45,38,.08); font-size:12px; }
    button { cursor:pointer; } button:hover,button.active { border-color:#a76536; background:#fff; }
    .readout { margin-left:auto; }
    .caption { position:absolute; left:14px; bottom:14px; padding:7px 10px; border-radius:7px; background:rgba(255,255,255,.84); color:#58615a; font-size:12px; }
    body.review .toolbar,body.review .caption { display:none; }
    @media(max-width:600px){.readout{width:100%;margin-left:0}button,.readout{padding:7px 9px;font-size:11px}}
  </style>
</head>
<body>
<div id="app">
  <div class="toolbar" aria-label="Clue board preview views">
    <button data-view="front">正面</button><button data-view="left">侧面</button><button data-view="rear">背面</button>
    <button data-view="top">俯视</button><button data-view="three">三分之四</button>
    <span class="readout">12.0 × 8.8 × 1.10 units · +Z 正面</span>
  </div>
  <div class="caption">拖动旋转 · 滚轮缩放</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
  import { createClueBoardModel } from './createClueBoardModel.js';

  const params=new URLSearchParams(location.search);
  const pass=params.get('pass')||'lighting';
  const diagnostic=params.get('diagnostic')==='1';
  document.body.classList.toggle('review',params.get('review')==='1');
  const app=document.querySelector('#app');
  const scene=new THREE.Scene(); scene.background=new THREE.Color(diagnostic?'#ffffff':'#f7f5ef');
  const camera=new THREE.PerspectiveCamera(32,innerWidth/innerHeight,.1,100);
  const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75));renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
  renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;app.appendChild(renderer.domElement);
  scene.add(new THREE.HemisphereLight(0xfff8ed,0x9ca8a7,1.75));
  const key=new THREE.DirectionalLight(0xffead5,2.15);key.position.set(8,12,12);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.radius=3;key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=12;key.shadow.camera.bottom=-2;scene.add(key);
  const fill=new THREE.DirectionalLight(0xdfeaff,.72);fill.position.set(-8,8,5);scene.add(fill);
  const rim=new THREE.DirectionalLight(0xfff0d5,.48);rim.position.set(3,10,-10);scene.add(rim);

  const model=createClueBoardModel({pass});scene.add(model);model.updateMatrixWorld(true);
  if(!diagnostic){
    const floor=new THREE.Mesh(new THREE.CircleGeometry(20,64),new THREE.MeshStandardMaterial({color:0xf7f5ef,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.04;floor.receiveShadow=true;scene.add(floor);
  } else model.traverse(object=>{if(object.isMesh){object.castShadow=false;object.receiveShadow=false;}});

  const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,4.4,0);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=10;controls.maxDistance=35;controls.maxPolarAngle=Math.PI*.55;
  const views={
    front:{p:[0,4.55,21],t:[0,4.4,0]},left:{p:[-19,4.8,1.5],t:[0,4.4,0]},rear:{p:[0,4.55,-21],t:[0,4.4,0]},
    top:{p:[0,20,.01],t:[0,4.15,0]},three:{p:[13.6,8.3,16.2],t:[0,4.35,0]},right:{p:[19,4.8,1.5],t:[0,4.4,0]}
  };
  function setView(name){const view=views[name]||views.three;const mobile=innerWidth<600?1.28:1;camera.position.set(view.p[0]*mobile,view.p[1]*mobile,view.p[2]*mobile);controls.target.set(...view.t);camera.lookAt(controls.target);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));}
  document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
  setView(params.get('view')||'three');

  const box=new THREE.Box3().setFromObject(model);const size=box.getSize(new THREE.Vector3());
  let meshCount=0,triangles=0;const movable=[];const stringChecks=[];
  model.traverse(object=>{
    if(object.isMesh){meshCount+=1;triangles+=(object.geometry.index?object.geometry.index.count:object.geometry.attributes.position.count)/3;}
    if(object.userData.transformEditable){movable.push({id:object.name,position:object.position.toArray().map(v=>+v.toFixed(4)),rotation:[object.rotation.x,object.rotation.y,object.rotation.z].map(v=>+v.toFixed(4)),scale:object.scale.toArray().map(v=>+v.toFixed(4))});}
    if(object.userData.startAnchor)stringChecks.push({id:object.name,start:object.userData.startAnchor,end:object.userData.endAnchor,radius:object.userData.radius});
  });
  window.__clueBoardReport={bounds:{min:box.min.toArray().map(v=>+v.toFixed(4)),max:box.max.toArray().map(v=>+v.toFixed(4)),size:size.toArray().map(v=>+v.toFixed(4))},meshCount,triangles:Math.round(triangles),movable,stringChecks,pass};
  document.documentElement.dataset.clueBoardReport=JSON.stringify(window.__clueBoardReport);
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);setView(params.get('view')||'three');});
  let frames=0,start=performance.now();function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);frames++;const now=performance.now();if(now-start>1000){window.__clueBoardMetrics={fps:Math.round(frames*1000/(now-start)),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,horizontalOverflow:document.documentElement.scrollWidth>innerWidth,viewport:[innerWidth,innerHeight],pass};document.documentElement.dataset.clueBoardRuntime=JSON.stringify(window.__clueBoardMetrics);frames=0;start=now;}}animate();
  window.clueBoardPreview={scene,camera,model,controls,setView,views,pass};
</script>
</body>
</html>
