<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Desk Preview | Detective Lodge</title>
  <style>
    :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, sans-serif; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #f7f5ef; color: #4d3a32; }
    #app { position: relative; height: 100%; }
    canvas { display:block; width:100%; height:100%; }
    .toolbar { position:absolute; top:16px; left:16px; right:16px; display:flex; gap:8px; align-items:center; flex-wrap:wrap; pointer-events:none; }
    .toolbar > * { pointer-events:auto; }
    .title { font-weight:700; letter-spacing:.02em; margin-right:8px; }
    button { border:1px solid #d7c5b8; background:#fffaf4; color:#5b4035; border-radius:8px; padding:8px 11px; cursor:pointer; box-shadow:0 2px 8px #6b433412; }
    button:hover, button.active { background:#efd7bd; border-color:#b77b52; }
    .meta { position:absolute; right:18px; bottom:16px; background:#fffaf4d9; border:1px solid #dfcec0; border-radius:8px; padding:8px 10px; font-size:12px; line-height:1.4; }
    @media (max-width: 600px) { .toolbar { top:10px; left:10px; right:10px; } .title { width:100%; } button { padding:7px 9px; font-size:12px; } .meta { right:10px; bottom:10px; font-size:11px; } }
  </style>
</head>
<body>
<main id="app">
  <div class="toolbar"><span class="title">Detective Lodge Desk</span><button data-view="front">Front</button><button data-view="left">Left</button><button data-view="right">Right</button><button data-view="rear">Rear</button><button data-view="top">Top</button><button data-view="three">3/4</button></div>
  <div class="meta">10.2 W × 6.0 D × 7.8 H · procedural preview<br>Orbit: drag · Zoom: wheel</div>
</main>
<script type="importmap">
  {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
  import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
  import { createDeskModel } from './createDeskModel.js';

  const app = document.getElementById('app');
  const scene = new THREE.Scene(); scene.background = new THREE.Color('#f7f5ef');
  const camera = new THREE.PerspectiveCamera(34, innerWidth / innerHeight, 0.1, 100); camera.position.set(13, 10.5, 16);
  const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false }); renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05; app.appendChild(renderer.domElement);
  const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.target.set(0, 3.7, 0); controls.minDistance = 10; controls.maxDistance = 28;
  const desk = createDeskModel(); scene.add(desk);
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(50,50), new THREE.ShadowMaterial({ color:0x8a6f62, opacity:.16 })); ground.rotation.x = -Math.PI/2; ground.position.y = -0.01; ground.receiveShadow = true; scene.add(ground);
  scene.add(new THREE.HemisphereLight(0xfff8ed, 0xb4c4d6, 2.0));
  const key = new THREE.DirectionalLight(0xffe1bd, 3.2); key.position.set(8,14,12); key.castShadow = true; key.shadow.mapSize.set(1536,1536); key.shadow.camera.left=-12; key.shadow.camera.right=12; key.shadow.camera.top=12; key.shadow.camera.bottom=-12; key.shadow.bias=-0.0004; scene.add(key);
  const fill = new THREE.DirectionalLight(0xc9ddff, 1.25); fill.position.set(-10,8,-8); scene.add(fill);
  const views = { front:[0,7.4,18], left:[-18,7.5,0], right:[18,7.5,0], rear:[0,7.4,-18], top:[0,22,0.01], three:[14,11,16] };
  function setView(id) { const p=views[id]; camera.position.set(...p); controls.target.set(0,3.7,0); controls.update(); document.querySelectorAll('button[data-view]').forEach(b=>b.classList.toggle('active', b.dataset.view===id)); }
  document.querySelectorAll('button[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));
  setView('three');
  addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });
  function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); } animate();
</script>
</body>
</html>
