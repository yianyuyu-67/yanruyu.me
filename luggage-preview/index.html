<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Luggage Preview</title>
  <style>html,body{margin:0;height:100%;overflow:hidden;background:#eee7df}canvas{display:block;width:100%;height:100%}</style>
</head>
<body>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { createLuggageModel } from './createLuggageModel.js';
const scene=new THREE.Scene(); scene.background=new THREE.Color(0xeee7df);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,100); camera.position.set(5,4.8,7.6);
const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setPixelRatio(Math.min(devicePixelRatio,2)); renderer.setSize(innerWidth,innerHeight); renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; renderer.outputColorSpace=THREE.SRGBColorSpace; document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff4e8,0x6a5145,2.1)); const key=new THREE.DirectionalLight(0xffdfbf,4.2); key.position.set(5,8,7); key.castShadow=true; key.shadow.mapSize.set(1024,1024); scene.add(key);
const floor=new THREE.Mesh(new THREE.PlaneGeometry(24,24),new THREE.MeshStandardMaterial({color:0xc28b65,roughness:.86})); floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
const luggage=createLuggageModel(); luggage.position.y=.02; scene.add(luggage);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,1.9,0); controls.enableDamping=true; controls.minDistance=5; controls.maxDistance=14;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
function frame(){requestAnimationFrame(frame);controls.update();renderer.render(scene,camera)} frame();
</script>
</body>
</html>
