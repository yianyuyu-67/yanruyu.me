import * as THREE from 'three';import{OrbitControls}from'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';import{createArchiveCabinetModel}from'./createArchiveCabinetModel.js';
const app=document.getElementById('app'),scene=new THREE.Scene();scene.background=new THREE.Color('#f7f5ef');const camera=new THREE.PerspectiveCamera(30,innerWidth/innerHeight,.1,100);camera.position.set(16,10.5,24);const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;app.appendChild(renderer.domElement);const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.target.set(0,6,0);controls.minDistance=10;controls.maxDistance=28;const cabinet=createArchiveCabinetModel();scene.add(cabinet);const ground=new THREE.Mesh(new THREE.PlaneGeometry(45,45),new THREE.ShadowMaterial({color:0x756c56,opacity:.15}));ground.rotation.x=-Math.PI/2;ground.position.y=-.01;ground.receiveShadow=true;scene.add(ground);scene.add(new THREE.HemisphereLight(0xfff9e9,0xb9c8d8,2.1));const key=new THREE.DirectionalLight(0xffe2b7,3.1);key.position.set(8,16,12);key.castShadow=true;key.shadow.mapSize.set(1536,1536);key.shadow.camera.left=-9;key.shadow.camera.right=9;key.shadow.camera.top=14;key.shadow.camera.bottom=-2;scene.add(key);const fill=new THREE.DirectionalLight(0xcfe0ff,1.15);fill.position.set(-8,9,-8);scene.add(fill);const views={front:[0,6.5,27],left:[-27,6.5,0],right:[27,6.5,0],rear:[0,7,-27],top:[0,23,.01],three:[17,11,24]};function setView(id){const p=views[id];camera.position.set(...p);controls.target.set(0,6,0);controls.update();document.querySelectorAll('button[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===id));}document.querySelectorAll('button[data-view]').forEach(b=>b.addEventListener('click',()=>setView(b.dataset.view)));setView('three');addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});function loop(){requestAnimationFrame(loop);controls.update();renderer.render(scene,camera)}loop();
