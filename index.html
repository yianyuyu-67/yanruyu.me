<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Yu Detective Agency · 小予侦探社</title>
  <meta name="description" content="闫茹玉（小予）的互动式个人作品集：一间可以走进去的三维侦探事务所。实习卷宗、创业纸箱、vibe coding 作品，全部可以亲手翻开。" />
  <style>
    html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #0e0b08; }
    #frame { position: absolute; top: 0; left: 0; border: 0; background: #0e0b08; }
  </style>
</head>
<body>
<iframe id="frame" title="Yu Detective Agency"></iframe>
<script>
  // 手机强制横屏壳：竖屏手机访问时，把整个站点装进一个「横向尺寸」的
  // iframe 里再旋转 90°。iframe 内部感知到的仍是正常横向视口，坐标、
  // 事件、布局零改造；浏览器会自动把触摸坐标映射进旋转后的 iframe。
  const frame = document.querySelector('#frame');
  frame.src = 'app.html' + location.search + location.hash;

  const portraitPhone = window.matchMedia('(orientation: portrait) and (pointer: coarse) and (max-width: 760px)');

  function layout() {
    if (portraitPhone.matches) {
      const w = window.innerWidth, h = window.innerHeight;   // 设备竖屏：w 窄 h 高
      frame.style.position = 'absolute';
      frame.style.width = h + 'px';                          // iframe 是「横向」的
      frame.style.height = w + 'px';
      frame.style.transformOrigin = 'top left';
      frame.style.transform = 'rotate(90deg) translateY(-100%)';
      frame.style.top = '0';
      frame.style.left = '0';
    } else {
      frame.style.position = 'absolute';
      frame.style.width = '100%';
      frame.style.height = '100%';
      frame.style.transform = 'none';
      frame.style.top = '0';
      frame.style.left = '0';
    }
  }

  layout();
  window.addEventListener('resize', layout);
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  portraitPhone.addEventListener?.('change', layout);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', layout);
</script>
</body>
</html>
