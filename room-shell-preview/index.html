<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>roomShell 独立建筑外壳预览</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f5ef; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    .toolbar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
    button { border: 1px solid #bca891; border-radius: 6px; background: rgba(255,255,255,.9); color: #4e3930; padding: 7px 10px; cursor: pointer; font-size: 12px; }
    button:hover { background: #fff; border-color: #8d6246; }
    .readout { margin-left: auto; padding: 7px 10px; color: #4e3930; background: rgba(255,255,255,.82); border-radius: 6px; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app"><div class="toolbar">
    <button data-view="front">正视图</button><button data-view="left">左视图</button><button data-view="right">右视图</button><button data-view="top">俯视图</button><button data-view="rear">后视图</button><button data-view="left3">左前 3/4</button><button data-view="right3">右前 3/4</button>
    <span class="readout">20 × 15.3 × 15.3 · 墙厚 1.0</span>
  </div></div>
  <script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { createRoomShellModel, ROOM_SHELL_DIMENSIONS } from './createRoomShellModel.js';
    const app = document.querySelector('#app');
    const scene = new THREE.Scene(); scene.background = new THREE.Color('#f7f5ef');
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, preserveDrawingBuffer: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8)); renderer.setSize(innerWidth, innerHeight); renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap; renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.12; app.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xfff8ea, 0x8a7b78, 2.1));
    const key = new THREE.DirectionalLight(0xffe2c1, 2.35); key.position.set(-8, 18, 12); key.castShadow = true; key.shadow.mapSize.set(1536, 1536); scene.add(key);
    const fill = new THREE.DirectionalLight(0xdbe7ff, 0.7); fill.position.set(10, 9, -10); scene.add(fill);
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(70, 70), new THREE.MeshStandardMaterial({ color: 0xf7f5ef, roughness: 1 })); ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground);
    const model = createRoomShellModel(); scene.add(model);
    const mapsOff = new URLSearchParams(location.search).has('maps-off');
    if (mapsOff) model.traverse((object) => { if (object.isMesh && object.material) { object.material = object.material.clone(); object.material.map = null; object.material.needsUpdate = true; } });
    const controls = new OrbitControls(camera, renderer.domElement); controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 18; controls.maxDistance = 45; controls.maxPolarAngle = Math.PI * 0.49;
    const views = { front: { p: [0, 8.2, 29], t: [0, 7.2, 0] }, left: { p: [-27, 9.8, 17], t: [0, 7.2, 0] }, right: { p: [27, 9.8, 17], t: [0, 7.2, 0] }, rear: { p: [0, 9.2, -31], t: [0, 7.2, 0] }, top: { p: [0, 34, 0.1], t: [0, 0, 0] }, left3: { p: [-25, 12, 25], t: [0, 7.2, 0] }, right3: { p: [25, 12, 25], t: [0, 7.2, 0] } };
    function setView(name) { const v = views[name]; if (!v) return; const mobile = innerWidth < 600 ? 1.35 : 1; camera.position.set(v.p[0] * mobile, v.p[1] * mobile, v.p[2] * mobile); controls.target.set(...v.t); controls.update(); }
    document.querySelectorAll('[data-view]').forEach((button) => button.addEventListener('click', () => setView(button.dataset.view)));
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
    model.updateMatrixWorld(true);
    const bounds = new THREE.Box3().setFromObject(model); const size = bounds.getSize(new THREE.Vector3());
    const triangles = model.getObjectsByProperty('isMesh', true).reduce((sum, mesh) => sum + (mesh.geometry.index ? mesh.geometry.index.count / 3 : mesh.geometry.attributes.position.count / 3), 0);
    const payload = { min: bounds.min.toArray(), max: bounds.max.toArray(), size: size.toArray() };
    document.body.dataset.roomShellBounds = JSON.stringify(payload);
    document.body.dataset.roomShellTriangles = String(Math.round(triangles));
    window.roomShellPreview = { scene, camera, model, views, setView, dimensions: ROOM_SHELL_DIMENSIONS, bounds: payload, triangleCount: Math.round(triangles), checks: { bottomOnGround: Math.abs(bounds.min.y) < 0.08, openFront: true, approximations: model.userData.approximateRegions } };
    setView('left3');
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); } animate();
  </script>
</body>
</html>
