<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typewriter Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f7f5ef; }
    #app { position: relative; width: 100%; height: 100%; }
    canvas { display: block; width: 100%; height: 100%; }
    .toolbar { position: absolute; top: 14px; left: 14px; right: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; pointer-events: none; }
    .toolbar button, .toolbar .readout { pointer-events: auto; border: 1px solid #c6c0b1; background: rgba(255,255,255,.88); color: #30413a; border-radius: 8px; padding: 8px 11px; font-size: 12px; cursor: pointer; box-shadow: 0 2px 8px rgba(60,55,45,.08); }
    .toolbar button:hover { background: #fff; border-color: #829a8a; }
    .readout { margin-left: auto; cursor: default; }
    .caption { position: absolute; bottom: 14px; left: 14px; padding: 7px 10px; border-radius: 7px; background: rgba(255,255,255,.78); color: #536159; font-size: 12px; }
  </style>
</head>
<body>
  <div id="app">
    <div class="toolbar" aria-label="Preview views">
      <button data-view="front">Front</button>
      <button data-view="left3">Left 3/4</button>
      <button data-view="right3">Right 3/4</button>
      <button data-view="left">Left</button>
      <button data-view="right">Right</button>
      <button data-view="rear">Rear</button>
      <button data-view="top">Top</button>
      <span class="readout">6.8 × 5.4 × 4.6 units</span>
    </div>
    <div class="caption">Drag to orbit · wheel to zoom</div>
  </div>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
  </script>
  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
    import { createTypewriterModel } from './createTypewriterModel.js';

    const app = document.querySelector('#app');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#f7f5ef');
    const camera = new THREE.PerspectiveCamera(35, innerWidth / innerHeight, 0.1, 100);
    camera.position.set(0, 4.8, 12.8);
    camera.lookAt(0, 2.35, 0);
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 1.8));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    app.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xfff9ec, 0x9aa7b0, 2.25));
    const key = new THREE.DirectionalLight(0xffe5bd, 2.8);
    key.position.set(5, 10, 8); key.castShadow = true;
    key.shadow.mapSize.set(1024, 1024); key.shadow.camera.left = -8; key.shadow.camera.right = 8; key.shadow.camera.top = 8; key.shadow.camera.bottom = -5;
    scene.add(key);
    const fill = new THREE.DirectionalLight(0xdceaff, 0.85); fill.position.set(-7, 6, -6); scene.add(fill);

    const floor = new THREE.Mesh(new THREE.CircleGeometry(14, 64), new THREE.MeshStandardMaterial({ color: 0xf7f5ef, roughness: 1 }));
    floor.rotation.x = -Math.PI / 2; floor.position.y = -0.015; floor.receiveShadow = true; scene.add(floor);
    const model = createTypewriterModel(); scene.add(model);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 2.35, 0); controls.enableDamping = true; controls.dampingFactor = 0.08; controls.minDistance = 7; controls.maxDistance = 22; controls.maxPolarAngle = Math.PI * 0.49;

    const views = {
      front: { p: [0, 4.0, 12.5], t: [0, 2.35, 0] },
      left3: { p: [-10.2, 5.2, 9.2], t: [0, 2.35, 0] },
      right3: { p: [10.2, 5.2, 9.2], t: [0, 2.35, 0] },
      left: { p: [-12.5, 3.7, 0.2], t: [0, 2.35, 0] },
      right: { p: [12.5, 3.7, 0.2], t: [0, 2.35, 0] },
      rear: { p: [0, 4.2, -12.5], t: [0, 2.35, 0] },
      top: { p: [0, 15.0, 0.01], t: [0, 0, 0] },
    };
    function setView(name) { const v = views[name]; if (!v) return; const scale = innerWidth < 600 ? 2.15 : 1; camera.position.set(v.p[0] * scale, v.p[1] * scale, v.p[2] * scale); controls.target.set(...v.t); controls.update(); }
    document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));
    addEventListener('resize', () => { camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); setView('front'); });
    function animate() { requestAnimationFrame(animate); controls.update(); renderer.render(scene, camera); }
    animate();
    window.typewriterPreview = { scene, camera, model, setView, views };
  </script>
</body>
</html>
