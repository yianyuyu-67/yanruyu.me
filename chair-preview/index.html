<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Carved Green Leather Chair Preview</title>
  <style>
    :root { color-scheme: light; font-family: Inter, "Microsoft YaHei", system-ui, sans-serif; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#f7f5ef; }
    #app { position:relative; width:100%; height:100%; }
    canvas { display:block; width:100%; height:100%; }
    .toolbar { position:absolute; z-index:3; top:14px; left:14px; right:14px; display:flex; flex-wrap:wrap; gap:8px; pointer-events:none; }
    button, .readout { pointer-events:auto; border:1px solid #c9c3b7; border-radius:7px; padding:8px 11px; background:rgba(255,255,255,.9); color:#3f443f; box-shadow:0 2px 8px rgba(55,45,38,.08); font-size:12px; }
    button { cursor:pointer; }
    button:hover, button.active { border-color:#76533d; background:#fff; }
    .readout { margin-left:auto; }
    .caption { position:absolute; left:14px; bottom:14px; padding:7px 10px; border-radius:7px; background:rgba(255,255,255,.82); color:#58615a; font-size:12px; }
    body.review .toolbar, body.review .caption { display:none; }
    @media (max-width:600px) { .readout { width:100%; margin-left:0; } button,.readout { padding:7px 9px; font-size:11px; } }
  </style>
</head>
<body>
<div id="app">
  <div class="toolbar" aria-label="Chair preview views">
    <button data-view="front">正面</button><button data-view="left">左侧</button><button data-view="right">右侧</button>
    <button data-view="rear">背面</button><button data-view="top">俯视</button><button data-view="three">三分之四</button>
    <span class="readout">52 × 62.5 × 105 cm · 座高 48 cm</span>
  </div>
  <div class="caption">拖动旋转 · 滚轮缩放</div>
</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}</script>
<script type="module">
  import * as THREE from 'three';
  import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';
  import { createChairModel } from './createChairModel.js';

  const params = new URLSearchParams(location.search);
  const pass = params.get('pass') || 'lighting';
  const diagnostic = params.get('diagnostic') === '1';
  document.body.classList.toggle('review', params.get('review') === '1');
  const app = document.querySelector('#app');
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(diagnostic ? '#ffffff' : '#f7f5ef');
  const camera = new THREE.PerspectiveCamera(34, innerWidth/innerHeight, .1, 100);
  const renderer = new THREE.WebGLRenderer({antialias:true,alpha:false,preserveDrawingBuffer:true});
  renderer.setPixelRatio(Math.min(devicePixelRatio,1.75)); renderer.setSize(innerWidth,innerHeight);
  renderer.outputColorSpace=THREE.SRGBColorSpace; renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=1.08;
  renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap; app.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xfff8eb,0x9eaaa1,1.75));
  const key=new THREE.DirectionalLight(0xffead0,2.2);key.position.set(7,12,10);key.castShadow=true;key.shadow.mapSize.set(1024,1024);key.shadow.radius=3;key.shadow.camera.left=-8;key.shadow.camera.right=8;key.shadow.camera.top=14;key.shadow.camera.bottom=-3;scene.add(key);
  const rim=new THREE.DirectionalLight(0xe5efff,.75);rim.position.set(-7,10,-8);scene.add(rim);
  if (!diagnostic) {
    const floor=new THREE.Mesh(new THREE.CircleGeometry(18,64),new THREE.MeshStandardMaterial({color:0xf7f5ef,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.012;floor.receiveShadow=true;scene.add(floor);
  }
  const model=createChairModel({pass});scene.add(model);
  if (diagnostic) model.traverse(object => { if (object.isMesh) { object.castShadow = false; object.receiveShadow = false; } });
  model.updateMatrixWorld(true);
  const modelBox = new THREE.Box3().setFromObject(model);
  const modelSize = modelBox.getSize(new THREE.Vector3());
  const legGrounding = {};
  let meshCount = 0;
  let triangles = 0;
  model.traverse(object => {
    if (!object.isMesh) return;
    meshCount += 1;
    const index = object.geometry.index;
    const position = object.geometry.attributes.position;
    triangles += index ? index.count / 3 : position.count / 3;
    if (/FrontLeg$|RearLeg$/.test(object.name)) {
      const box = new THREE.Box3().setFromObject(object);
      legGrounding[object.name] = Number(box.min.y.toFixed(4));
    }
  });
  const chairReport = {
    bounds:{
      min:modelBox.min.toArray().map(value => Number(value.toFixed(4))),
      max:modelBox.max.toArray().map(value => Number(value.toFixed(4))),
      size:modelSize.toArray().map(value => Number(value.toFixed(4))),
    },
    legGrounding,
    meshCount,
    triangles:Math.round(triangles),
    pass,
  };
  document.documentElement.dataset.chairReport = JSON.stringify(chairReport);

  const controls=new OrbitControls(camera,renderer.domElement);controls.target.set(0,5.2,0);controls.enableDamping=true;controls.dampingFactor=.08;controls.minDistance=10;controls.maxDistance=35;controls.maxPolarAngle=Math.PI*.49;
  const views={
    front:{p:[0,5.7,20],t:[0,5.2,0]}, left:{p:[-20,5.7,0],t:[0,5.2,0]}, right:{p:[20,5.7,0],t:[0,5.2,0]},
    rear:{p:[0,5.7,-20],t:[0,5.2,0]}, top:{p:[0,21,.01],t:[0,4.0,0]}, three:{p:[13.5,8.1,15.5],t:[0,5.1,0]},
    detail:{p:[7.2,6.7,8.4],t:[0,5.8,-.7]}
  };
  function setView(name){const v=views[name]||views.three;const mobile=innerWidth<600?1.35:1;camera.position.set(v.p[0]*mobile,v.p[1]*mobile,v.p[2]*mobile);controls.target.set(...v.t);camera.lookAt(controls.target);controls.update();document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));}
  document.querySelectorAll('[data-view]').forEach(button=>button.addEventListener('click',()=>setView(button.dataset.view)));
  setView(params.get('view')||'three');
  addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);setView(params.get('view')||'three');});
  let frames=0,start=performance.now();
  function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera);frames++;const now=performance.now();if(now-start>1000){window.__chairMetrics={fps:Math.round(frames*1000/(now-start)),calls:renderer.info.render.calls,triangles:renderer.info.render.triangles,geometries:renderer.info.memory.geometries,pass,viewport:[innerWidth,innerHeight],horizontalOverflow:document.documentElement.scrollWidth>innerWidth};document.documentElement.dataset.chairRuntime=JSON.stringify(window.__chairMetrics);frames=0;start=now;}}
  animate();
  window.chairPreview={scene,camera,model,controls,setView,views,pass};
</script>
</body>
</html>
